# Build and test without a camera, on Windows and Linux.
# No secrets, no publishing: the only permission is reading the repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Tests that need a camera run only with OPTICMIX_HW=1, which is never set here.

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3's build script (opticmix-vision-py) needs an interpreter; the notices check is a Python script; one
      # opticmix-vision unit test runs the Python package's frame statistics class with it (standard library only).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The default `capture` feature runs bindgen (v4l2-sys-mit) on linux/videodev2.h.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev linux-libc-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Fetch crates
        working-directory: rust
        run: cargo fetch --locked
      - name: Third-party notices match Cargo.lock
        run: python -I rust/tools/third_party_notices.py --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (default features)
        working-directory: rust
        run: cargo test -p opticmix-vision --locked
      - name: Test (no default features)
        working-directory: rust
        run: cargo test -p opticmix-vision --no-default-features --locked
      # The examples' `--synthetic` paths (the crate's test doubles) are built only with `test-support`.
      - name: Test (test-support)
        working-directory: rust
        run: cargo test -p opticmix-vision --features test-support --locked
      - name: Build the Python extension crate
        working-directory: rust
        run: cargo build -p opticmix-vision-py --locked

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # opencv-python needs these to import. The extension itself builds without capture, so no libclang.
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          key: py${{ matrix.python }}
      - name: Build and install the wheel
        working-directory: python
        run: |
          python -m pip install maturin==1.16.0 pytest==9.2.0
          python -m maturin build --release --locked -o dist
          python -m pip install dist/*.whl
          python -m pip freeze
      # examples/torch_dataloader.py (tutorial 03 and its example test) needs PyTorch, which the package does not
      # install; elsewhere those two tests skip. CPU build, one Python version per OS.
      - name: PyTorch (CPU) for the torch_dataloader example
        if: matrix.python == '3.12'
        run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      # The deselected test lists the DirectShow devices of the machine it runs on.
      - name: Pytest
        working-directory: python
        run: >-
          python -m pytest -q -p no:cacheprovider
          --deselect tests/test_ctrl_dshow.py::test_enumeration_runs_through_com_without_binding_anything

  msrv:
    name: Rust 1.88 build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --workspace --locked
