[build-system]
# Camera controls and device listing live in the Rust core (../rust/opticmix-vision); this package ships it as the
# extension opticmix_vision._core.
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "opticmix-vision"
version = "0.0.6"
description = "Python SDK for the Weevia S1 stereo IR camera (UVC): capture, stereo split, camera controls, IR illuminator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# LICENSE is ours; THIRD_PARTY_NOTICES.txt covers the Rust crates linked into the extension
# (written by ../rust/tools/third_party_notices.py). Both land in .dist-info/licenses/.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
authors = [{ name = "Opticmix" }]
keywords = ["stereo", "infrared", "camera", "uvc", "fisheye"]
# "Operating System" says where a wheel on PyPI installs, not what is supported: from 0.0.4 PyPI carries a
# manylinux wheel, so Linux stays listed. Linux is experimental and not a supported platform — the README says so
# where Linux is first mentioned. Trove classifiers have no per-OS "experimental"; Pre-Alpha covers the package.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.14",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Opticmix/opticmix-vision"
Issues = "https://github.com/Opticmix/opticmix-vision/issues"

[tool.maturin]
manifest-path = "../rust/opticmix-vision-py/Cargo.toml"
module-name = "opticmix_vision._core"
python-source = "."
features = ["extension-module"]

# The generated SBOM records the build machine's paths; leave it out of the wheel.
[tool.maturin.sbom]
rust = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: 실기기가 연결돼 있어야 하는 테스트 (환경변수 OPTICMIX_HW=1 로 활성화)",
]
